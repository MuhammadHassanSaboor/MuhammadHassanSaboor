<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Muhammad Hassan Saboor - Data Analyst and Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b3d"/>
      <stop offset="100%" stop-color="#2b1a4d"/>
    </linearGradient>

    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#2ea3f2"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="200" rx="12"/>
    </clipPath>

    <style>
      .title {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      .subtitle {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #9db4d0;
        letter-spacing: 3px;
      }
      .fade-title  { opacity: 0; animation: fadeUp 1.1s ease-out 0.15s forwards; }
      .fade-sub    { opacity: 0; animation: fadeUp 1.1s ease-out 0.55s forwards; }
      .fade-rule   { opacity: 0; animation: grow   0.9s ease-out 0.95s forwards; }
      .twinkle     { animation: twinkle 3.2s ease-in-out infinite; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes grow {
        from { opacity: 0; transform: scaleX(0); }
        to   { opacity: 1; transform: scaleX(1); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; }
        50%      { opacity: 0.75; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="200" fill="url(#bg)"/>

    <!-- drifting particles -->
    <g fill="#58a6ff">
      <circle class="twinkle" cx="90"  cy="42"  r="1.8" style="animation-delay:0s"/>
      <circle class="twinkle" cx="205" cy="28"  r="1.3" style="animation-delay:0.6s"/>
      <circle class="twinkle" cx="330" cy="55"  r="1.6" style="animation-delay:1.2s"/>
      <circle class="twinkle" cx="700" cy="36"  r="1.4" style="animation-delay:0.3s"/>
      <circle class="twinkle" cx="812" cy="60"  r="1.9" style="animation-delay:1.6s"/>
      <circle class="twinkle" cx="925" cy="30"  r="1.2" style="animation-delay:2.1s"/>
      <circle class="twinkle" cx="470" cy="24"  r="1.4" style="animation-delay:2.6s"/>
      <circle class="twinkle" cx="600" cy="62"  r="1.1" style="animation-delay:1.9s"/>
    </g>

    <!-- back wave -->
    <g opacity="0.30">
      <path fill="url(#waveA)"
        d="M0,150 q125,-38 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V200 H0 Z">
        <animateTransform attributeName="transform" type="translate"
          from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- front wave -->
    <g opacity="0.55">
      <path fill="url(#waveB)"
        d="M0,165 q125,-30 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V200 H0 Z">
        <animateTransform attributeName="transform" type="translate"
          from="-500 0" to="0 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <text class="title fade-title" x="500" y="88" text-anchor="middle">Muhammad Hassan Saboor</text>

    <rect class="fade-rule" x="360" y="104" width="280" height="2" rx="1"
          fill="url(#waveA)" style="transform-origin:500px 105px"/>

    <text class="subtitle fade-sub" x="500" y="132" text-anchor="middle">
      DATA ANALYST &#183; MACHINE LEARNING &amp; DEEP LEARNING ENGINEER
    </text>

    <!-- sweeping shine across the title -->
    <rect x="-260" y="55" width="200" height="60" fill="url(#shine)" opacity="0.35">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="1400 0" dur="5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
